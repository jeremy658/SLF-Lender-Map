<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SLF Lender Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--green:#376A41;--dark:#2b5334;--gold:#E4B476;--grey:#606060;--cream:#f6f3ec;--ink:#22271f;--line:#e2ded4;}
*{box-sizing:border-box;} html,body{margin:0;height:100%;}
body{font-family:Inter,'Helvetica Neue',Arial,sans-serif;color:var(--ink);background:var(--cream);display:flex;flex-direction:column;height:100vh;}
header{background:var(--dark);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
header h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.3px;}
header .count{font-size:12px;color:var(--gold);font-weight:600;}
.tabs{display:flex;gap:4px;margin-left:auto;}
.tabs button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;}
.tabs button.active{background:var(--gold);color:var(--dark);border-color:var(--gold);}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.bar input,.bar select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit;}
.bar input[type=search]{flex:1;min-width:180px;}
.bar .clr{background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px;}
main{flex:1;overflow:auto;position:relative;}
#map{position:absolute;inset:0;}
.mapnote{position:absolute;bottom:10px;left:10px;z-index:500;background:#fff;padding:6px 10px;border-radius:6px;font-size:11px;color:var(--grey);box-shadow:0 1px 4px rgba(0,0,0,.2);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px;}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 15px;border-top:3px solid var(--green);}
.card h3{margin:0 0 2px;font-size:14.5px;color:var(--dark);}
.card .sub{font-size:12px;color:var(--grey);margin-bottom:7px;}
.card .bf{font-size:12.5px;line-height:1.45;margin:6px 0;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
.chip{font-size:10.5px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:2px 8px;color:var(--grey);}
.chip.k{background:#eaf3ec;color:var(--green);border-color:#cfe4d5;}
.badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px;}
.b-Verified{background:#dff3e4;color:#1f7a3d;} .b-KB{background:#e4eefb;color:#2456a6;} .b-Intel{background:#fdf0d9;color:#8a5a12;} .b-def{background:#eee;color:#555;}
table{border-collapse:collapse;width:100%;font-size:12.5px;background:#fff;}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
th{position:sticky;top:0;background:var(--green);color:#fff;cursor:pointer;white-space:nowrap;font-size:11.5px;}
th:hover{background:var(--dark);} tr:hover td{background:#faf8f2;} td.lender{font-weight:600;color:var(--dark);}
.pop b{color:var(--dark);} .pop{font-size:12.5px;line-height:1.5;max-width:250px;}
.leaflet-popup-content{margin:10px 12px;}
.hl{font-weight:700;}
.card .notes{font-size:11.5px;line-height:1.5;color:#4a4a42;background:var(--cream);border-left:3px solid var(--gold);padding:6px 9px;margin:7px 0 2px;border-radius:0 5px 5px 0;white-space:pre-wrap;}
.card .notes .nl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--grey);margin-bottom:2px;}
td.notes{font-size:11px;color:#555;max-width:340px;white-space:pre-wrap;}
.pop .pnotes{font-size:11px;color:#555;margin-top:5px;padding-top:5px;border-top:1px solid #eee;}
.card .contact{font-size:12px;margin:2px 0 6px;line-height:1.5;}
.card .contact a{color:var(--green);text-decoration:none;font-weight:600;}
.card .contact a:hover{text-decoration:underline;}
.card .contact.none{color:#b3ab9b;font-style:italic;}
.pop a{color:var(--green);text-decoration:none;font-weight:600;}
.muted{color:#c4bdb0;}
td a{color:var(--green);text-decoration:none;font-weight:600;} td a:hover{text-decoration:underline;}
</style></head><body>
<header>
 <h1>SLF Lender Map</h1><span class="count" id="count"></span>
 <div class="tabs">
  <button data-v="map" class="active">Map</button>
  <button data-v="cards">Cards</button>
  <button data-v="list">List</button>
 </div>
</header>
<div class="bar">
 <input type="search" id="q" placeholder="Search lender, contact, product, best-for, notes...">
 <select id="fClass"><option value="">All classes</option></select>
 <select id="fRegion"><option value="">All regions</option></select>
 <select id="fConf"><option value="">Any confidence</option><option>Verified</option><option>KB</option><option>Intel</option></select>
 <button class="clr" id="clr">Clear</button>
</div>
<main>
 <div id="map"></div>
 <div class="mapnote" id="mapnote"></div>
 <div class="grid" id="cards" style="display:none"></div>
 <div id="listwrap" style="display:none"><table id="list"></table></div>
</main>

const $=s=>document.querySelector(s);
const norm=s=>(s||'').toString();
function confClass(c){c=norm(c);if(/verified/i.test(c))return'Verified';if(/\bKB\b/i.test(c))return'KB';if(/intel/i.test(c))return'Intel';return'def';}
// populate filters
const classes=[...new Set(DATA.map(r=>r.Class).filter(Boolean))].sort();
classes.forEach(c=>{let o=document.createElement('option');o.textContent=c;$('#fClass').appendChild(o);});
const regions=[...new Set(DATA.map(r=>r.Region).filter(Boolean))].sort();
regions.forEach(c=>{let o=document.createElement('option');o.textContent=c;$('#fRegion').appendChild(o);});

let view='map', sortKey='Lender', sortDir=1;
function filtered(){
 const q=$('#q').value.toLowerCase().trim(), fc=$('#fClass').value, fr=$('#fRegion').value, ff=$('#fConf').value;
 return DATA.filter(r=>{
  if(fc&&r.Class!==fc)return false;
  if(fr&&r.Region!==fr)return false;
  if(ff&&confClass(r.Confidence)!==ff)return false;
  if(q){const hay=[r.Lender,r.Contact,r.Products,r.PropertyTypes,r.BestFor,r.Notes,r.Region,r.Title,r.Email,r.Phone].join(' ').toLowerCase();if(!hay.includes(q))return false;}
  return true;
 });
}
let map,layer;
function renderMap(rs){
 if(!map){map=L.map('map',{scrollWheelZoom:true}).setView([44.3,-79.2],6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);}
 if(layer)map.removeLayer(layer); layer=L.layerGroup().addTo(map);
 let n=0,nolL=0;
 rs.forEach(r=>{ if(r._lat==null){nolL++;return;} n++;
  const col=confClass(r.Confidence)==='Verified'?'#1f7a3d':confClass(r.Confidence)==='KB'?'#2456a6':'#c78a1a';
  const m=L.circleMarker([r._lat,r._lng],{radius:6,color:'#fff',weight:1.5,fillColor:col,fillOpacity:.9});
  const _cl=contactLine(r);
  var _nt=norm(r.Notes);if(_nt.length>240)_nt=_nt.slice(0,240)+'…';
  m.bindPopup('<div class="pop"><b>'+esc(r.Lender)+'</b>'+(r.Contact?'<br>'+esc(r.Contact)+(r.Title?', '+esc(r.Title):''):'')+(_cl?'<br>'+_cl:'')+'<br>'+esc(r.Region)+(r.MaxLTV?' &middot; '+esc(r.MaxLTV)+'% LTV':'')+'<br>'+esc(r.BestFor||r.Products||'')+(_nt?'<div class="pnotes">'+esc(_nt)+'</div>':'')+'</div>');
  layer.addLayer(m);
 });
 $('#mapnote').textContent=n+' lenders mapped'+(nolL?'  •  '+nolL+' without a location (see List/Cards)':'');
}
function esc(s){return norm(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function isRealEmail(e){e=norm(e).trim();return /@/.test(e)&&!/[()\s]/.test(e)&&/\.[a-z]{2,}$/i.test(e);}
function emailHTML(e){e=norm(e).trim();return isRealEmail(e)?'<a href="mailto:'+esc(e)+'">'+esc(e)+'</a>':'';}
function phoneHTML(p){var d=norm(p).replace(/[^0-9]/g,'');if(d.length<7)return'';var tel=d.length===10?'+1'+d:(d.length===11?'+'+d:d);return '<a href="tel:'+tel+'">'+esc(norm(p).trim())+'</a>';}
function _emails(t){t=norm(t);var m=t.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g)||[];return m;}
function _phones(t){t=norm(t);var m=t.match(/\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4}/g)||[];return m.filter(function(x){return x.replace(/[^0-9]/g,'').length>=10;});}
function gatherContacts(r){
 var em=[],ph=[],seenE={},seenP={};
 var eSrc=[r.Email].concat(_emails(r.Notes));
 eSrc.forEach(function(e){e=norm(e).trim();if(isRealEmail(e)){var k=e.toLowerCase();if(!seenE[k]){seenE[k]=1;em.push(e);}}});
 var pSrc=[r.Phone].concat(_phones(r.Phone)).concat(_phones(r.Notes));
 pSrc.forEach(function(pp){pp=norm(pp).trim();var d=pp.replace(/[^0-9]/g,'');if(d.length>=10){if(!seenP[d]){seenP[d]=1;ph.push(pp);}}});
 return {em:em.slice(0,3),ph:ph.slice(0,3)};
}
function contactLine(r){var c=gatherContacts(r);var b=[];
 c.em.forEach(function(e){b.push('&#9993; <a href="mailto:'+esc(e)+'">'+esc(e)+'</a>');});
 c.ph.forEach(function(pp){var d=pp.replace(/[^0-9]/g,'');var tel=d.length===10?'+1'+d:(d.length===11?'+'+d:d);b.push('&#9742; <a href="tel:'+tel+'">'+esc(pp)+'</a>');});
 return b.join(' &middot; ');}
function renderCards(rs){
 $('#cards').innerHTML=rs.map(r=>{const cc=confClass(r.Confidence);
  const prods=norm(r.Products).split(/[;,]/).map(x=>x.trim()).filter(Boolean).slice(0,4);
  const cl=contactLine(r);
  return `<div class="card"><h3>${esc(r.Lender)}</h3><div class="sub">${esc(r.Contact)||'—'}${r.Title?' &middot; '+esc(r.Title):''}${r.Region?' &middot; '+esc(r.Region):''}</div>
   ${cl?`<div class="contact">${cl}</div>`:`<div class="contact none">No direct contact on file</div>`}
   <div class="bf">${esc(r.BestFor||r.Products||'')}</div>
   ${r.Notes?`<div class="notes"><span class="nl">Access / notes</span> ${esc(r.Notes)}</div>`:''}
   <div class="chips">${r.MaxLTV?`<span class="chip k">${esc(r.MaxLTV)}% LTV</span>`:''}${r.LoanMin||r.LoanMax?`<span class="chip k">$${fmt(r.LoanMin)}–$${fmt(r.LoanMax)}</span>`:''}${r.Position?`<span class="chip">${esc(r.Position)}</span>`:''}${prods.map(p=>`<span class="chip">${esc(p)}</span>`).join('')}</div>
   ${r.Confidence?`<div style="margin-top:9px"><span class="badge b-${cc}">${esc(r.Confidence)}</span></div>`:''}</div>`;
 }).join('')||'<p style="padding:20px;color:#888">No lenders match.</p>';
}
function fmt(v){v=norm(v).replace(/[^0-9]/g,'');if(!v)return'?';const n=+v;return n>=1e6?(n/1e6)+'M':n>=1e3?(n/1e3)+'K':n;}
const COLS=[['Lender','Lender'],['Contact','Contact'],['Email','Email'],['Phone','Phone'],['Class','Class'],['Region','Region'],['MaxLTV','LTV%'],['Confidence','Conf'],['Notes','Access / notes']];
function renderList(rs){
 rs=rs.slice().sort((a,b)=>{let x=norm(a[sortKey]).toLowerCase(),y=norm(b[sortKey]).toLowerCase();return x<y?-sortDir:x>y?sortDir:0;});
 let h='<tr>'+COLS.map(c=>`<th data-k="${c[0]}">${c[1]}${sortKey===c[0]?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr>';
 h+=rs.map(r=>{const c=gatherContacts(r);
  const eH=c.em.map(e=>`<a href="mailto:${esc(e)}">${esc(e)}</a>`).join('<br>')||'<span class="muted">—</span>';
  const pH=c.ph.map(pp=>{const d=pp.replace(/[^0-9]/g,'');const tel=d.length===10?'+1'+d:(d.length===11?'+'+d:d);return `<a href="tel:${tel}">${esc(pp)}</a>`;}).join('<br>')||'<span class="muted">—</span>';
  return `<tr><td class="lender">${esc(r.Lender)}</td><td>${esc(r.Contact)}</td><td>${eH}</td><td>${pH}</td><td>${esc(r.Class)}</td><td>${esc(r.Region)}</td><td>${esc(r.MaxLTV)}</td><td><span class="badge b-${confClass(r.Confidence)}">${esc(r.Confidence||'')}</span></td><td class="notes">${esc(r.Notes||'')}</td></tr>`;}).join('');
 const t=$('#list');t.innerHTML=h;
 t.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();});
}
function render(){
 const rs=filtered();
 $('#count').textContent=rs.length+' of '+DATA.length+' lenders';
 $('#map').style.display=view==='map'?'block':'none';
 $('#mapnote').style.display=view==='map'?'block':'none';
 $('#cards').style.display=view==='cards'?'grid':'none';
 $('#listwrap').style.display=view==='list'?'block':'none';
 if(view==='map'){renderMap(rs);setTimeout(()=>map&&map.invalidateSize(),50);}
 if(view==='cards')renderCards(rs);
 if(view==='list')renderList(rs);
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.v;render();});
['#q','#fClass','#fRegion','#fConf'].forEach(s=>$(s).addEventListener('input',render));
$('#clr').onclick=()=>{$('#q').value='';$('#fClass').value='';$('#fRegion').value='';$('#fConf').value='';render();};
render();
</script></body></html>
